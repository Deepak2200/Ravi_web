<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ground Level Travel | Ravi Yadav - Official Portfolio</title>
  
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    /* ==========================================================
       CSS VARIABLES & THEME SETUP
       ========================================================== */
    :root {
      --primary: #FF0000;
      --primary-glow: rgba(255, 0, 0, 0.45);
      --primary-dark: #b80000;
      --bg-main: #0a0a0c;
      --bg-surface: #121216;
      --bg-surface-elevated: #1a1a22;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(255, 0, 0, 0.35);
      --text-main: #f5f5f7;
      --text-muted: #9ba1b0;
      --font-heading: 'Orbitron', sans-serif;
      --font-sub: 'Rajdhani', sans-serif;
      --font-body: 'Inter', sans-serif;
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.6;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(255, 0, 0, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(255, 0, 0, 0.04) 0%, transparent 40%);
    }

    /* Selection & Scrollbar */
    ::selection {
      background: var(--primary);
      color: #fff;
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #08080a;
    }
    ::-webkit-scrollbar-thumb {
      background: #26262e;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary);
    }

    /* Container */
    .container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Typography Utilities */
    .section-header {
      text-align: center;
      margin-bottom: 3.5rem;
      position: relative;
    }
    .section-tag {
      font-family: var(--font-sub);
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 700;
      font-size: 0.95rem;
      display: inline-block;
      margin-bottom: 0.5rem;
    }
    .section-title {
      font-family: var(--font-heading);
      font-size: clamp(1.8rem, 3.5vw, 2.5rem);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .section-title span {
      color: var(--primary);
      text-shadow: 0 0 15px var(--primary-glow);
    }
    .section-desc {
      color: var(--text-muted);
      max-width: 600px;
      margin: 0.75rem auto 0;
      font-size: 0.95rem;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 28px;
      border-radius: 8px;
      font-family: var(--font-sub);
      font-weight: 700;
      font-size: 1.05rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-decoration: none;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid transparent;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 0 20px var(--primary-glow);
    }
    .btn-primary:hover {
      background: #ff2b2b;
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.7);
    }
    .btn-outline {
      background: rgba(255, 255, 255, 0.03);
      color: #fff;
      border: 1px solid var(--border-color);
      backdrop-filter: blur(10px);
    }
    .btn-outline:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(255, 0, 0, 0.08);
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
    }

    /* ==========================================================
       GLASSMORPHISM NAVBAR
       ========================================================== */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(10, 10, 12, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      transition: var(--transition);
    }
    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.1rem 0;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #fff;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: 1px;
    }
    .brand-logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--primary), #880000);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px var(--primary-glow);
    }
    .brand-logo-icon i {
      font-size: 1rem;
      color: #fff;
    }
    .nav-links {
      display: flex;
      list-style: none;
      gap: 2rem;
      align-items: center;
    }
    .nav-link {
      text-decoration: none;
      color: var(--text-muted);
      font-family: var(--font-sub);
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: 1px;
      transition: var(--transition);
      position: relative;
    }
    .nav-link:hover, .nav-link.active {
      color: #fff;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0%;
      height: 2px;
      background: var(--primary);
      transition: var(--transition);
      box-shadow: 0 0 8px var(--primary);
    }
    .nav-link:hover::after {
      width: 100%;
    }

    .hamburger {
      display: none;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }

    /* ==========================================================
       HERO SECTION (90VH)
       ========================================================== */
    .hero {
      height: 90vh;
      min-height: 650px;
      display: flex;
      align-items: center;
      position: relative;
      padding-top: 60px;
      overflow: hidden;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: 3rem;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 30px;
      background: rgba(255, 0, 0, 0.1);
      border: 1px solid var(--border-accent);
      color: var(--primary);
      font-family: var(--font-sub);
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 1px;
      margin-bottom: 1.25rem;
      animation: pulseGlow 2.5s infinite ease-in-out;
    }
    .hero-badge i {
      animation: spin 6s linear infinite;
    }
    .hero-title {
      font-family: var(--font-heading);
      font-size: clamp(2.3rem, 4.8vw, 4rem);
      line-height: 1.15;
      margin-bottom: 1rem;
      font-weight: 900;
    }
    .hero-title .glow {
      color: var(--primary);
      text-shadow: 0 0 25px rgba(255, 0, 0, 0.6);
    }
    .hero-handle {
      font-family: var(--font-sub);
      color: var(--text-muted);
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hero-handle span {
      color: #fff;
    }
    .hero-bio {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 2rem;
      max-width: 520px;
    }
    .hero-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .hero-visual {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .visual-card-wrap {
      position: relative;
      width: 320px;
      height: 380px;
      border-radius: 20px;
      background: linear-gradient(145deg, #181820, #0d0d10);
      border: 1px solid var(--border-accent);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 0, 0, 0.2);
      animation: floatHero 5s ease-in-out infinite;
    }
    .glow-ring {
      position: absolute;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      border: 2px dashed rgba(255, 0, 0, 0.25);
      animation: spin 35s linear infinite;
      z-index: 0;
    }
    .avatar-wrap {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 3px solid var(--primary);
      padding: 5px;
      background: #0f0f14;
      margin-bottom: 1.2rem;
      position: relative;
      z-index: 1;
      box-shadow: 0 0 25px var(--primary-glow);
    }
    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    .channel-title-tag {
      font-family: var(--font-heading);
      font-size: 1.2rem;
      font-weight: 700;
      text-align: center;
      z-index: 1;
    }
    .channel-subtitle-tag {
      font-family: var(--font-sub);
      color: var(--primary);
      font-weight: 700;
      letter-spacing: 2px;
      font-size: 0.95rem;
      margin-top: 4px;
      z-index: 1;
    }
    .live-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 15px;
      padding: 4px 12px;
      background: rgba(0, 255, 128, 0.1);
      border: 1px solid rgba(0, 255, 128, 0.3);
      border-radius: 20px;
      font-size: 0.8rem;
      color: #00ff80;
      font-family: var(--font-sub);
      font-weight: 700;
      letter-spacing: 1px;
      z-index: 1;
    }
    .live-status .dot {
      width: 7px;
      height: 7px;
      background: #00ff80;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ff80;
      animation: blink 1.2s infinite;
    }

    /* ==========================================================
       YOUTUBE FEED SECTION (5 VIDEOS VIA RSS)
       ========================================================== */
    .section-feed {
      padding: 6rem 0;
      background: linear-gradient(180deg, var(--bg-main) 0%, var(--bg-surface) 100%);
      position: relative;
    }
    .feed-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
    }
    .feed-card {
      background: var(--bg-surface-elevated);
      border-radius: 14px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: var(--transition);
      cursor: pointer;
      position: relative;
    }
    .feed-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--primary);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.7), 0 0 25px rgba(255, 0, 0, 0.25);
    }
    .feed-card .thumb-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #09090b;
      overflow: hidden;
    }
    .feed-card .thumb-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: var(--transition);
    }
    .feed-card:hover .thumb-wrapper img {
      transform: scale(1.06);
    }
    .play-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 54px;
      height: 54px;
      background: rgba(255, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px var(--primary-glow);
      transition: var(--transition);
    }
    .play-overlay i {
      color: #fff;
      font-size: 1.25rem;
      margin-left: 3px;
    }
    .feed-card:hover .play-overlay {
      transform: translate(-50%, -50%) scale(1.15);
      background: var(--primary);
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
    }
    .feed-info {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .feed-date {
      font-size: 0.8rem;
      color: var(--primary);
      font-family: var(--font-sub);
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 0.4rem;
    }
    .feed-title {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 1rem;
      line-height: 1.45;
      color: #fff;
      margin-bottom: 0.8rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .feed-meta {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 0.75rem;
    }
    .feed-meta a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: var(--transition);
    }
    .feed-meta a:hover {
      text-shadow: 0 0 10px var(--primary);
    }

    /* Skeleton Loading Cards */
    .skeleton-card {
      background: var(--bg-surface-elevated);
      border-radius: 14px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      height: 320px;
      position: relative;
    }
    .skeleton-thumb {
      width: 100%;
      height: 180px;
      background: #181820;
      position: relative;
      overflow: hidden;
    }
    .skeleton-line {
      height: 14px;
      background: #181820;
      border-radius: 4px;
      margin: 1rem 1.2rem;
      position: relative;
      overflow: hidden;
    }
    .skeleton-line.short {
      width: 50%;
    }
    .shimmer::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
      animation: shimmer 1.5s infinite;
    }

    /* ==========================================================
       ABOUT & STATS SECTION
       ========================================================== */
    .section-about {
      padding: 6rem 0;
      background: var(--bg-main);
      position: relative;
    }
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3.5rem;
      align-items: center;
    }
    .about-story h3 {
      font-family: var(--font-heading);
      font-size: 1.8rem;
      margin-bottom: 1.2rem;
      letter-spacing: 0.5px;
    }
    .about-story p {
      color: var(--text-muted);
      margin-bottom: 1.2rem;
      font-size: 1rem;
    }
    .stats-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
      margin-top: 2rem;
    }
    .stat-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 1.5rem;
      text-align: center;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--primary);
    }
    .stat-card:hover {
      transform: translateY(-5px);
      border-color: var(--border-accent);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 0, 0, 0.15);
    }
    .stat-icon {
      font-size: 1.8rem;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }
    .stat-number {
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: 800;
      color: #fff;
    }
    .stat-label {
      font-family: var(--font-sub);
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.95rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 0.2rem;
    }

    /* Content Pillars */
    .pillar-box {
      background: var(--bg-surface);
      border-radius: 16px;
      padding: 2rem;
      border: 1px solid var(--border-color);
    }
    .pillar-item {
      display: flex;
      align-items: flex-start;
      gap: 1.2rem;
      margin-bottom: 1.5rem;
    }
    .pillar-item:last-child {
      margin-bottom: 0;
    }
    .pillar-icon-box {
      width: 45px;
      height: 45px;
      border-radius: 10px;
      background: rgba(255, 0, 0, 0.1);
      border: 1px solid var(--border-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .pillar-text h4 {
      font-family: var(--font-sub);
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.2rem;
    }
    .pillar-text p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin: 0;
    }

    /* ==========================================================
       BARCODE / QR CODE CONNECT SECTION
       ========================================================== */
    .section-barcode {
      padding: 5rem 0;
      background: radial-gradient(circle at center, #181822 0%, #0a0a0c 80%);
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
    }
    .barcode-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-accent);
      border-radius: 20px;
      padding: 3rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 3rem;
      box-shadow: 0 0 35px rgba(255, 0, 0, 0.15);
      position: relative;
      overflow: hidden;
    }
    .barcode-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
      pointer-events: none;
    }
    .barcode-info {
      max-width: 550px;
    }
    .barcode-info h3 {
      font-family: var(--font-heading);
      font-size: 1.8rem;
      margin-bottom: 0.8rem;
    }
    .barcode-info p {
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }
    .qr-frame {
      background: #ffffff;
      padding: 14px;
      border-radius: 18px;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.35);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 250px;
    }
    .qr-frame:hover {
      transform: scale(1.05) rotate(1deg);
      box-shadow: 0 0 45px rgba(255, 0, 0, 0.6);
    }
    .qr-frame img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
    }
    .qr-label {
      margin-top: 8px;
      font-family: var(--font-sub);
      font-weight: 700;
      color: #0a0a0c;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .qr-label i {
      color: var(--primary);
    }

    /* ==========================================================
       CONTACT FORM SECTION
       ========================================================== */
    .section-contact {
      padding: 6rem 0;
      background: var(--bg-surface);
      position: relative;
    }
    .contact-wrapper {
      max-width: 750px;
      margin: 0 auto;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 3rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      position: relative;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    .form-label {
      display: block;
      font-family: var(--font-sub);
      font-weight: 600;
      font-size: 0.95rem;
      color: #fff;
      margin-bottom: 0.5rem;
      letter-spacing: 0.5px;
    }
    .form-control {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px 16px;
      color: #fff;
      font-family: var(--font-body);
      font-size: 0.95rem;
      transition: var(--transition);
      outline: none;
    }
    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 12px var(--primary-glow);
      background: #16161d;
    }
    textarea.form-control {
      resize: vertical;
      min-height: 130px;
    }
    .form-status {
      margin-top: 1rem;
      padding: 10px;
      border-radius: 6px;
      display: none;
      font-size: 0.9rem;
      text-align: center;
      font-family: var(--font-sub);
      font-weight: 600;
    }
    .form-status.success {
      display: block;
      background: rgba(0, 255, 128, 0.1);
      color: #00ff80;
      border: 1px solid rgba(0, 255, 128, 0.3);
    }

    /* ==========================================================
       FOOTER & SOCIAL ICONS
       ========================================================== */
    .footer {
      background: #060608;
      border-top: 1px solid var(--border-color);
      padding: 4rem 0 2rem;
      text-align: center;
    }
    .footer-brand {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 1rem;
    }
    .footer-brand span {
      color: var(--primary);
    }
    .footer-desc {
      color: var(--text-muted);
      max-width: 500px;
      margin: 0 auto 2rem;
      font-size: 0.95rem;
    }
    .social-links {
      display: flex;
      justify-content: center;
      gap: 1.25rem;
      margin-bottom: 2.5rem;
    }
    .social-btn {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
